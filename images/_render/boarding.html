<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#e8e0d4}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7e6ee"/><stop offset="100%" stop-color="#e7f0e6"/>

    <radialGradient id="skin" cx="40%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#f3d3bc"/><stop offset="65%" stop-color="#e0b092"/><stop offset="100%" stop-color="#c4886c"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#efe6da"/>
  <rect x="40" y="40" width="780" height="820" fill="#f7f4ee"/>
  <g filter="url(#soft)">
    <rect x="64" y="64" width="732" height="772" fill="url(#sky)"/>
    <ellipse cx="280" cy="700" rx="240" ry="70" fill="#7eaea0"/>
    <ellipse cx="560" cy="720" rx="180" ry="50" fill="#5e9082"/>
    <rect x="160" y="430" width="46" height="200" fill="#e7eef3"/>
    <rect x="230" y="390" width="36" height="240" fill="#f4f7f8"/>

  </g>
  <rect x="40" y="40" width="780" height="820" fill="none" stroke="#e6ddd0" stroke-width="16"/>

  <!-- standing student, legs to the floor -->

  <path d="M1120 900 L1148 640 L1220 600 L1260 660 L1288 900Z" fill="#0c2c54"/>
  <path d="M1000 640
           C1020 500 1120 430 1240 440
           C1360 450 1460 540 1460 680
           L1480 900 L980 900Z" fill="#12375f"/>
  <path d="M1180 500 C1160 430 1190 360 1230 330 C1280 300 1340 340 1340 410 C1340 470 1300 530 1250 540 C1210 530 1188 520 1180 500Z" fill="#d7a888"/>

  <path d="M1360 560 C1440 640 1400 760 1280 790" fill="none" stroke="#1a4574" stroke-width="48" stroke-linecap="round"/>

  <ellipse cx="1240" cy="230" rx="120" ry="120" fill="#241c18"/>
  <ellipse cx="1270" cy="270" rx="96" ry="112" fill="url(#skin)"/>
  <path d="M1180 210 C1230 150 1360 150 1400 230 C1330 180 1220 190 1180 250Z" fill="#241c18"/>
  <ellipse cx="1182" cy="290" rx="14" ry="24" fill="#e2b394"/>
  <path d="M1218 258 q18 -12 36 1" fill="none" stroke="#5c4638" stroke-width="3.2" stroke-linecap="round"/>
  <ellipse cx="1236" cy="276" rx="15" ry="7" fill="#f8eee6"/>
  <ellipse cx="1230" cy="280" rx="5.2" ry="4.2" fill="#2c241e"/>
  <path d="M1300 250 q16 -10 34 2" fill="none" stroke="#5c4638" stroke-width="3.2" stroke-linecap="round"/>
  <ellipse cx="1316" cy="266" rx="14" ry="6.5" fill="#f8eee6"/>
  <ellipse cx="1310" cy="270" rx="4.8" ry="4" fill="#2c241e"/>
  <path d="M1268 292 c-6 26 -2 42 6 56" fill="none" stroke="#c48468" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M1236 368 q26 12 48 -2" fill="none" stroke="#b86b60" stroke-width="3.2" stroke-linecap="round"/>

  <g transform="translate(1240 720) rotate(-6)">
    <rect width="120" height="160" rx="4" fill="#f7f4ee" stroke="#e4ddd2"/>

  </g>
  <g transform="translate(1210 760) rotate(-8)">
    <ellipse cx="0" cy="0" rx="28" ry="16" fill="#e2b394"/>
    <ellipse cx="16" cy="-6" rx="8" ry="11" fill="#edc7ad"/>
  </g>
  <!-- suitcase -->
  <g transform="translate(900 680)">
    <rect width="90" height="70" rx="6" fill="#8d704c"/>
    <rect x="30" y="-16" width="30" height="18" rx="6" fill="none" stroke="#8d704c" stroke-width="6"/>
    <rect y="64" width="90" height="10" rx="3" fill="#6d5438"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.11"/>
</svg>
</body>
</html>
